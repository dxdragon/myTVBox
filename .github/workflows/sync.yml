name: Sync TVBox 单线路

on:
  schedule:
    - cron: '0 1 * * *'      # 每天 UTC 1 点（北京时间 9 点）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并解压 TVBoxOSC/tvbox 到仓库根目录
        run: |
          curl -fsSL -o /tmp/src.zip "https://pizazz.us.ci/%E5%8D%95%E7%BA%BF%E8%B7%AF.zip"
          mkdir -p /tmp/ex
          python3 - <<'PY'
          import zipfile, pathlib
          DST = pathlib.Path('/tmp/ex'); PREFIX = 'TVBoxOSC/tvbox/'
          with zipfile.ZipFile('/tmp/src.zip') as z:
              for info in z.infolist():
                  # 处理 Windows 打包的 GBK 中文文件名（如 js/路漫漫.js、版本.png）
                  if info.flag_bits & 0x800:
                      name = info.filename
                  else:
                      try: name = info.filename.encode('cp437').decode('gbk')
                      except Exception: name = info.filename
                  name = name.replace('\\', '/')
                  if not name.startswith(PREFIX) or info.is_dir(): continue
                  t = DST / name[len(PREFIX):]
                  t.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as f, open(t, 'wb') as out:
                      out.write(f.read())
          PY
          # 整体同步到根目录：.git 和 cookie 不动，上游删掉的文件也会跟着删
          rsync -a --delete \
                --exclude '.git' \
                --exclude 'TVBox/bili_cookie.txt' \
                /tmp/ex/ ./

      - name: 删除 api.json 中的“版本信息”
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('api.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          cfg['sites'] = [s for s in cfg['sites'] if s.get('key') != '版本信息']
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('剩余站点数:', len(cfg['sites']))
          PY

      - name: 提交推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "sync: 单线路 $(date -u '+%F %H:%M') UTC"
            git push
          fi
