name: Sync TVBox 单线路

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间凌晨 2 点（UTC 18:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载并解压 TVBoxOSC/tvbox
        run: |
          curl -fsSL -o /tmp/src.zip "https://pizazz.us.ci/%E5%8D%95%E7%BA%BF%E8%B7%AF.zip"
          mkdir -p /tmp/ex
          python3 - <<'PY'
          import zipfile, pathlib
          DST = pathlib.Path('/tmp/ex'); PREFIX = 'TVBoxOSC/tvbox/'
          with zipfile.ZipFile('/tmp/src.zip') as z:
              for info in z.infolist():
                  # 修复 Windows 打包的 GBK 中文文件名
                  if info.flag_bits & 0x800:
                      name = info.filename
                  else:
                      try: name = info.filename.encode('cp437').decode('gbk')
                      except Exception: name = info.filename
                  name = name.replace('\\', '/')
                  if not name.startswith(PREFIX) or info.is_dir(): continue
                  t = DST / name[len(PREFIX):]
                  t.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as f, open(t, 'wb') as out:
                      out.write(f.read())
          PY

      - name: 动态校验（api.json 为唯一事实来源）
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('/tmp/ex')

          def walk(o):
              if isinstance(o, dict):
                  for v in o.values(): yield from walk(v)
              elif isinstance(o, list):
                  for v in o: yield from walk(v)
              elif isinstance(o, str): yield o

          try:
              cfg = json.loads((root / 'api.json').read_text('utf-8'))
          except Exception as e:
              print(f'❌ api.json 无法解析: {e}'); sys.exit(1)

          refs = set()
          for s in walk(cfg):
              if s.startswith('./'):
                  path = s[2:].split(';')[0].split('?')[0].strip()
                  if path: refs.add(path)

          missing = [p for p in sorted(refs) if not (root / p).exists()]
          if missing:
              print(f'❌ api.json 引用了 {len(missing)} 个不存在的文件，'
                    f'判定上游包异常，中止同步（订阅端继续使用上一个可用版本）：')
              for p in missing: print('  [缺失] ./' + p)
              sys.exit(1)

          bad = [str(p.relative_to(root)) for p in root.rglob('*')
                 if p.is_file() and any(c in p.name for c in '�?æåø§')]
          if bad:
              print('⚠️ 疑似乱码文件（未阻断）:')
              for p in bad: print('  [乱码?]', p)

          print(f'✅ 校验通过：api.json 共引用 {len(refs)} 个本地文件，全部存在')
          PY

      - name: 本地定制（删版本信息/版本图 · logo 指向本仓库 · 合并 custom.json）
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('/tmp/ex')
          p = root / 'api.json'
          cfg = json.loads(p.read_text(encoding='utf-8'))

          # ---- 1) 删“版本信息”站点与 *版本.png ----
          before = len(cfg['sites'])
          cfg['sites'] = [s for s in cfg['sites']
                          if s.get('key') != '版本信息' and s.get('api') != 'csp_Market']
          pngs = []
          for f in root.glob('*版本.png'):
              f.unlink(); pngs.append(f.name)
          print(f'站点数 {before} → {len(cfg["sites"])}；已删除图片: {pngs or "无"}')

          # ---- 2) logo 改为仓库根目录的 logo.gif ----
          print(f'logo: {cfg.get("logo", "(无)")} → ./logo.gif')
          cfg['logo'] = './logo.gif'

          # ---- 3) 合并 custom.json 的 sites（custom.json 在仓库根目录）----
          cpath = pathlib.Path('custom.json')
          if not cpath.is_file():
              print('⚠️ 仓库根目录没有 custom.json，跳过站点合并')
          else:
              try:
                  c_sites = json.loads(cpath.read_text(encoding='utf-8'))['sites']
                  if not isinstance(c_sites, list):
                      raise ValueError('sites 字段不是数组')
              except Exception as e:
                  print(f'❌ custom.json 解析失败: {e}'); sys.exit(1)

              # key 冲突时以 custom.json 为准（不想要这个语义就删掉下面两行）
              c_keys = {s['key'] for s in c_sites
                        if isinstance(s, dict) and s.get('key')}
              dropped = [s.get('key') for s in cfg['sites'] if s.get('key') in c_keys]
              cfg['sites'] = [s for s in cfg['sites'] if s.get('key') not in c_keys]

              # 插入到第一个 key 或 name 含“动漫”的站点之前；找不到就追加到末尾
              idx = next((i for i, s in enumerate(cfg['sites'])
                          if '动漫' in s.get('name', '') or '动漫' in s.get('key', '')), None)
              if idx is None:
                  cfg['sites'].extend(c_sites)
                  print(f'⚠️ 上游没有含“动漫”的站点，{len(c_sites)} 个 custom 站点已追加到末尾')
              else:
                  cfg['sites'][idx:idx] = c_sites
                  anchor = cfg['sites'][idx + len(c_sites)].get('name', '?')
                  print(f'✅ 已在“{anchor}”之前插入 {len(c_sites)} 个 custom 站点'
                        f'（同 key 旧站点被替换: {dropped or "无"}）')

          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n',
                       encoding='utf-8')
          PY

      - name: 整体同步到仓库根目录
        run: |
          rsync -a --delete \
                --exclude '.git' \
                --exclude '.github' \
                --exclude '.gitignore' \
                --exclude 'custom.json' \
                --exclude 'logo.gif' \
                --exclude 'TVBox/bili_cookie.txt' \
                /tmp/ex/ ./

      - name: 提交推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "sync: 单线路 $(date -u '+%F %H:%M') UTC"
            git push
          fi