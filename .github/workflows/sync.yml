name: Sync TVBox 单线路

on:
  schedule:
    - cron: '0 18 * * *'      # 北京时间凌晨 2 点
  workflow_dispatch:
    inputs:
      force:
        description: '强制同步（忽略版本比对）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: single.json 取下载地址 → curl 下载 → 算版本指纹
        id: ver
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request, zipfile

          SINGLE = 'https://9877.kstore.space/single.json'

          def fetch_json(tries=3):
              err = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(SINGLE,
                                                   headers={'User-Agent': 'okhttp'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      err = e
                      print(f'· single.json 请求失败({i+1}/{tries}): {e}')
              raise err

          data = fetch_json()
          items = [it for g in data for it in g.get('list', []) if isinstance(it, dict)]
          dl = next((it for it in items if '下载' in it.get('name', '')
                     and str(it.get('url', '')).lower().endswith('.zip')), None)
          dl = dl or next((it for it in items
                           if str(it.get('url', '')).lower().endswith('.zip')), None)
          if not dl or not dl.get('url'):
              raise SystemExit('❌ single.json 中未找到下载条目')
          url = dl['url']
          print(f'下载地址: {url}')

          v = (dl.get('version') or '').strip()
          label = v if (v and v.lower() != 'version' and len(v) <= 20) else ''

          cmd = ['curl', '-fsSL', '--retry', '3', '--retry-delay', '2',
                 '--retry-all-errors', '--max-time', '300',
                 '-A', 'okhttp', '-o', '/tmp/src.zip', url]
          r = subprocess.run(cmd)
          if r.returncode in (51, 60):
              print('⚠️ 服务器证书与域名不匹配，跳过证书校验重试一次...')
              r = subprocess.run(cmd + ['-k'])
              if r.returncode == 0:
                  print('⚠️⚠️ 本次下载未校验 TLS 证书，已用 zip 结构+指纹校验兜底')
          if r.returncode != 0:
              raise SystemExit(
                  f'❌ curl 下载失败 (exit {r.returncode})\n'
                  f'   地址来自 single.json: {url}\n'
                  f'   22=HTTP错误(404/403,地址可能又换了) 28=超时 6=DNS失败')

          head = open('/tmp/src.zip', 'rb').read(4)
          if head[:2] != b'PK':
              raise SystemExit(f'❌ 下载内容不是 zip（前4字节 {head!r}）')
          with zipfile.ZipFile('/tmp/src.zip') as z:
              fp = '%04d%02d%02d-%02d%02d' % max(
                  i.date_time for i in z.infolist() if not i.is_dir())[:5]

          sf = pathlib.Path('.upstream_fingerprint')
          stored = sf.read_text('utf-8').strip() if sf.is_file() else ''
          skip = (os.environ.get('FORCE', '').lower() != 'true'
                  and stored and fp == stored)
          print(f'仓库指纹: {stored or "(空)"} | zip 指纹: {fp}')
          print(f'版本标签: {label or "(无真版本号,用指纹)"}')

          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          out.write(f'skip={"true" if skip else "false"}\n')
          out.write(f'fp={fp}\n')
          out.write(f'label={label or fp}\n')
          out.close()
          if skip: print('✅ 版本未变化，跳过同步')
          PY

      - name: 解压 TVBoxOSC/tvbox
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/ex
          python3 - <<'PY'
          import zipfile, pathlib
          DST = pathlib.Path('/tmp/ex'); PREFIX = 'TVBoxOSC/tvbox/'
          with zipfile.ZipFile('/tmp/src.zip') as z:
              for info in z.infolist():
                  if info.flag_bits & 0x800:
                      name = info.filename
                  else:
                      try: name = info.filename.encode('cp437').decode('gbk')
                      except Exception: name = info.filename
                  name = name.replace('\\', '/')
                  if not name.startswith(PREFIX) or info.is_dir(): continue
                  t = DST / name[len(PREFIX):]
                  t.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as f, open(t, 'wb') as out:
                      out.write(f.read())
          PY

      - name: 动态校验（api.json 为唯一事实来源）
        if: steps.ver.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('/tmp/ex')
          def walk(o):
              if isinstance(o, dict):
                  for v in o.values(): yield from walk(v)
              elif isinstance(o, list):
                  for v in o: yield from walk(v)
              elif isinstance(o, str): yield o
          try:
              cfg = json.loads((root / 'api.json').read_text('utf-8'))
          except Exception as e:
              print(f'❌ api.json 无法解析: {e}'); sys.exit(1)
          refs = set()
          for s in walk(cfg):
              if s.startswith('./'):
                  path = s[2:].split(';')[0].split('?')[0].strip()
                  if path: refs.add(path)
          missing = [p for p in sorted(refs) if not (root / p).exists()]
          if missing:
              print(f'❌ api.json 引用了 {len(missing)} 个不存在的文件，中止同步：')
              for p in missing: print('  [缺失] ./' + p)
              sys.exit(1)
          print(f'✅ 校验通过：api.json 共引用 {len(refs)} 个本地文件，全部存在')
          PY

      - name: 本地定制（删版本信息站点/版本图 · logo · 合并 custom.json）
        if: steps.ver.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('/tmp/ex')
          p = root / 'api.json'
          cfg = json.loads(p.read_text(encoding='utf-8'))

          before = len(cfg['sites'])
          cfg['sites'] = [s for s in cfg['sites']
                          if s.get('key') != '版本信息' and s.get('api') != 'csp_Market']
          for f in root.glob('*版本.png'): f.unlink()
          print(f'站点数 {before} → {len(cfg["sites"])}')

          print(f'logo: {cfg.get("logo", "(无)")} → ./logo.gif')
          cfg['logo'] = './logo.gif'

          cpath = pathlib.Path('custom.json')
          if not cpath.is_file():
              print('⚠️ 仓库根目录没有 custom.json，跳过站点合并')
          else:
              try:
                  c_sites = json.loads(cpath.read_text(encoding='utf-8'))['sites']
                  if not isinstance(c_sites, list):
                      raise ValueError('sites 字段不是数组')
              except Exception as e:
                  print(f'❌ custom.json 解析失败: {e}'); sys.exit(1)
              c_keys = {s['key'] for s in c_sites
                        if isinstance(s, dict) and s.get('key')}
              cfg['sites'] = [s for s in cfg['sites'] if s.get('key') not in c_keys]
              idx = next((i for i, s in enumerate(cfg['sites'])
                          if '动漫' in s.get('name', '') or '动漫' in s.get('key', '')), None)
              if idx is None:
                  cfg['sites'].extend(c_sites)
                  print('⚠️ 未找到含“动漫”的站点，已追加到末尾')
              else:
                  cfg['sites'][idx:idx] = c_sites
                  print(f'✅ 已插入 {len(c_sites)} 个自定义站点')

          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n',
                       encoding='utf-8')
          PY

      - name: 记录指纹
        if: steps.ver.outputs.skip != 'true'
        env:
          FP: ${{ steps.ver.outputs.fp }}
        run: printf '%s\n' "$FP" > .upstream_fingerprint

      - name: 整体同步到仓库根目录
        if: steps.ver.outputs.skip != 'true'
        run: |
          rsync -a --delete \
                --exclude '.git' \
                --exclude '.github' \
                --exclude '.gitignore' \
                --exclude 'custom.json' \
                --exclude 'logo.gif' \
                --exclude '.upstream_fingerprint' \
                --exclude 'TVBox/bili_cookie.txt' \
                /tmp/ex/ ./

      - name: 提交推送
        if: steps.ver.outputs.skip != 'true'
        env:
          LABEL: ${{ steps.ver.outputs.label }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无实际变化，不提交"; else
            git commit -m "sync: 单线路 ${LABEL}"
            git push
          fi
